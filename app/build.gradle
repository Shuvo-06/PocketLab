plugins {
    id 'com.android.application'
}

android {
    compileSdk 32

    defaultConfig {
        applicationId "com.pocketlab.app"
        minSdk 26
        targetSdk 32
        versionCode 1
        versionName "1.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // Studio Dolphin bundles JDK 11 and AGP 7.x supports Java 11 sources.
    // (Java 17 needs AGP 8+. Change both lines to VERSION_17 after upgrading.)
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.4.1'
    implementation 'com.google.android.material:material:1.6.0'
    implementation 'androidx.recyclerview:recyclerview:1.2.1'
    // Keep both lifecycle artifacts on the SAME version. Since 2.4.0 the -ktx classes live in the
    // main artifact, so mixing 2.4.x with a transitive -ktx 2.3.1 causes "Duplicate class" errors.
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.4.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.4.1'
    implementation 'androidx.navigation:navigation-fragment:2.4.2'
    implementation 'androidx.navigation:navigation-ui:2.4.2'

    def roomVersion = '2.4.2'
    implementation "androidx.room:room-runtime:$roomVersion"
    annotationProcessor "androidx.room:room-compiler:$roomVersion"

    // Cloud backup (Phase 9). The app also builds and runs without a Firebase project.
    implementation platform('com.google.firebase:firebase-bom:29.3.1')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'androidx.work:work-runtime:2.7.1'

    testImplementation 'junit:junit:4.13.2'
    // Real org.json for local unit tests (the android.jar one is a stub that throws).
    testImplementation 'org.json:json:20220320'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'
}

// Firebase is optional: the plugin is applied only if you added app/google-services.json
// (see docs/CLOUD_SETUP.md). Without it the app builds and runs; cloud features show "not set up".
if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
}
